name: Release

# Builds release binaries for Linux (x86_64, aarch64), macOS (x86_64,
# aarch64), and Windows (x86_64), packages them with the man page and shell
# completion scripts, generates SHA-256 checksums, and creates a GitHub
# Release with auto-generated notes extracted from CHANGELOG.md.
#
# Triggers:
#   - Tag push matching vX.Y.Z (semver).
#   - Manual dispatch (with optional dry-run flag) for validation without
#     publishing.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and package without creating a GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Docs: generate the man page and completion scripts from a native build.
  # These are platform-independent and are bundled into every archive.
  # ──────────────────────────────────────────────────────────────────────
  docs:
    name: Generate man page & completions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Build decon-cli (native)
        run: cargo build --release -p decon-cli
      - name: Generate man page
        run: ./target/release/decon manpage --output decon.1
      - name: Generate completion scripts
        run: |
          mkdir -p completions
          ./target/release/decon completions --shell bash       --output completions/decon.bash
          ./target/release/decon completions --shell zsh         --output completions/_decon
          ./target/release/decon completions --shell fish        --output completions/decon.fish
          ./target/release/decon completions --shell powershell  --output completions/_decon.ps1
      - name: Verify generated files are non-empty
        run: |
          test -s decon.1
          test -s completions/decon.bash
          test -s completions/_decon
          test -s completions/decon.fish
          test -s completions/_decon.ps1
      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decon-docs
          path: |
            decon.1
            completions/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────
  # Build matrix: one job per (OS, target) pair.
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: docs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            use-cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use-cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
            use-cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            use-cross: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.target }}
      - name: Download docs artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: decon-docs
          path: docs-artifact

      # ── Build ──────────────────────────────────────────────────────
      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cross
      - name: Build binary (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }} -p decon-cli
      - name: Build binary (native)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }} -p decon-cli

      # ── Determine version ───────────────────────────────────────────
      - name: Determine version from tag
        id: version
        shell: bash
        run: |
          # Strip leading 'v' from the tag (e.g. v0.1.0 → 0.1.0).
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch — read from Cargo.toml
            ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # ── Package (Unix) ──────────────────────────────────────────────
      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          staging="decon-${version}-${target}"
          mkdir -p "${staging}/completions"
          # Binary
          cp "target/${target}/release/decon" "${staging}/decon"
          chmod +x "${staging}/decon"
          # Docs (man page + completion scripts)
          cp docs-artifact/decon.1 "${staging}/"
          cp docs-artifact/completions/* "${staging}/completions/"
          # README snippet for quick reference
          cp README.md "${staging}/"
          tar czf "${staging}.tar.gz" "${staging}"

      # ── Package (Windows) ───────────────────────────────────────────
      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $target = "${{ matrix.target }}"
          $staging = "decon-$version-$target"
          New-Item -ItemType Directory -Force -Path "$staging\completions"
          # Binary
          Copy-Item "target/$target/release/decon.exe" "$staging/decon.exe"
          # Docs (man page + completion scripts)
          Copy-Item "docs-artifact/decon.1" "$staging/"
          Copy-Item "docs-artifact/completions/*" "$staging/completions/"
          # README snippet for quick reference
          Copy-Item "README.md" "$staging/"
          Compress-Archive -Path "$staging" -DestinationPath "$staging.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decon-${{ matrix.target }}
          path: decon-*-${{ matrix.target }}.*
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────
  # Release: collect all archives, generate checksums, extract changelog
  # notes, and create the GitHub Release (skipped in dry-run mode).
  # ──────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Skip release creation on manual dispatch when dry-run is true.
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Determine version from tag
        id: version
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: decon-*-*
          merge-multiple: true
      - name: Collect release archives
        run: |
          mkdir -p release-assets
          # Move all .tar.gz and .zip archives into release-assets/.
          find . -maxdepth 1 \( -name 'decon-*.tar.gz' -o -name 'decon-*.zip' \) \
            -exec mv {} release-assets/ \;
          echo "Release archives:"
          ls -la release-assets/
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS
          echo "SHA-256 checksums:"
          cat ../SHA256SUMS
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md.
          # The header looks like "## [0.1.0] - 2026-07-23".
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md entry found for version ${version}." > release-notes.md
          fi
          echo "Release notes:"
          cat release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${GITHUB_REF_NAME:-v${version}}"
          gh release create "$tag" \
            --title "decon ${version}" \
            --notes-file release-notes.md \
            release-assets/*
          echo "Created release ${tag}"
      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME:-v${{ steps.version.outputs.version }}}"
          gh release upload "$tag" SHA256SUMS --clobber

  # ──────────────────────────────────────────────────────────────────────
  # Publish to crates.io.
  # Workspace crates are published in dependency order:
  #   decon-core → decon-crawl → decon-llm → decon-pipeline → decon-cli
  # Each `cargo publish -p <crate>` waits for the previous to be available
  # on the registry before proceeding. Skipped in dry-run mode.
  # Requires the CRATES_TOKEN secret to be set in the repository.
  # ──────────────────────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
      - name: Publish decon-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish -p decon-core
      - name: Wait for decon-core to propagate
        run: sleep 20
      - name: Publish decon-crawl
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish -p decon-crawl
      - name: Wait for decon-crawl to propagate
        run: sleep 20
      - name: Publish decon-llm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish -p decon-llm
      - name: Wait for decon-llm to propagate
        run: sleep 20
      - name: Publish decon-pipeline
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish -p decon-pipeline
      - name: Wait for decon-pipeline to propagate
        run: sleep 20
      - name: Publish decon-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish -p decon-cli
