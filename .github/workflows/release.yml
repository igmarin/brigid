name: Release

# Builds a Linux x86_64 release binary, packages it with the man page and
# shell completion scripts, generates SHA-256 checksums, creates a GitHub
# Release with notes extracted from CHANGELOG.md, and publishes all
# workspace crates to crates.io.
#
# macOS users: `brew install brigid` (Homebrew formula in homebrew/brigid.rb)
#              or `cargo install brigid-cli` (compiles natively).
# Windows users: `cargo install brigid-cli` (compiles natively).
#
# Triggers:
#   - Tag push matching vX.Y.Z (semver).
#   - Manual dispatch (with optional dry-run flag) for validation without
#     publishing.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and package without creating a GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Build brigid-cli (release)
        run: cargo build --release --target x86_64-unknown-linux-gnu -p brigid-cli
      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/brigid

      # ── Docs: man page + completions ───────────────────────────────
      - name: Generate man page
        run: ./target/x86_64-unknown-linux-gnu/release/brigid manpage --output brigid.1
      - name: Generate completion scripts
        run: |
          mkdir -p completions
          ./target/x86_64-unknown-linux-gnu/release/brigid completions --shell bash       --output completions/brigid.bash
          ./target/x86_64-unknown-linux-gnu/release/brigid completions --shell zsh         --output completions/_brigid
          ./target/x86_64-unknown-linux-gnu/release/brigid completions --shell fish        --output completions/brigid.fish
          ./target/x86_64-unknown-linux-gnu/release/brigid completions --shell powershell  --output completions/_brigid.ps1
      - name: Verify generated files are non-empty
        run: |
          test -s brigid.1
          test -s completions/brigid.bash
          test -s completions/_brigid
          test -s completions/brigid.fish
          test -s completions/_brigid.ps1

      # ── Package ────────────────────────────────────────────────────
      - name: Determine version from tag
        id: version
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Prepare release archive and checksum
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="x86_64-unknown-linux-gnu"
          staging="brigid-${version}-${target}"
          mkdir -p "${staging}/completions"
          cp "target/${target}/release/brigid" "${staging}/brigid"
          chmod +x "${staging}/brigid"
          cp brigid.1 "${staging}/"
          cp completions/* "${staging}/completions/"
          cp README.md "${staging}/"
          tar czf "${staging}.tar.gz" "${staging}"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          echo "Archive contents:"
          tar tzf "${staging}.tar.gz"

      # ── Create GitHub Release (skipped in dry-run) ────────────────
      - name: Extract release notes from CHANGELOG.md
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true' }}
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md entry found for version ${version}." > release-notes.md
          fi
      - name: Create GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${GITHUB_REF_NAME:-v${version}}"
          gh release create "$tag" \
            --title "brigid ${version}" \
            --notes-file release-notes.md \
            brigid-*.tar.gz \
            brigid-*.tar.gz.sha256
          echo "Created release ${tag}"

  # ──────────────────────────────────────────────────────────────────────
  # Publish to crates.io.
  # Workspace crates are published in dependency order:
  #   brigid-core → brigid-crawl → brigid-pipeline → brigid-mcp → brigid-cli
  # Each `cargo publish -p <crate>` waits for the previous to be available
  # on the registry before proceeding. Skipped in dry-run mode.
  # Requires the CRATES_TOKEN secret to be set in the repository.
  # ──────────────────────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          set -euo pipefail
          for crate in brigid-core brigid-crawl brigid-pipeline brigid-mcp brigid-cli; do
            echo "Publishing ${crate}..."
            set +e
            cargo publish -p "${crate}" > "/tmp/publish-${crate}.log" 2>&1
            status=$?
            set -e
            if [ "${status}" -eq 0 ]; then
              echo "Published ${crate}"
            elif grep -qiE "already (exists|uploaded|published|on crates\.io)" "/tmp/publish-${crate}.log"; then
              echo "${crate} is already published; skipping"
            else
              cat "/tmp/publish-${crate}.log" >&2
              exit 1
            fi
            # Give the registry time to propagate before a downstream crate
            # declares a dependency on this version.
            if [ "${crate}" != "brigid-cli" ]; then
              sleep 20
            fi
          done
