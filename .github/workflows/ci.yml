name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # Pinned from dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo test --workspace

  # Verifies that tests/fixtures/baseline.json stays in sync with the fixture
  # directories. The regenerator is a standalone, zero-dependency Rust file.
  baseline-check:
    name: Fixture Baseline Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Verify baseline.json matches fixtures
        run: |
          rustc tests/fixtures/regenerate_baseline.rs -o /tmp/regen_baseline
          /tmp/regen_baseline tests/fixtures/ --check

  # M4-EVL-2: structural eval regression gate on the golden tutorial fixture
  # (good-mini must score at or above EVAL_THRESHOLD) plus a negative test on
  # broken-mini (must score below threshold). See issues #138 and #149.
  eval-regression:
    name: Eval Regression Gate
    runs-on: ubuntu-latest
    env:
      EVAL_THRESHOLD: 80
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Golden tutorial passes at threshold ${{ env.EVAL_THRESHOLD }}
        run: cargo run -p decon-cli -- eval --out tests/fixtures/tutorials/good-mini --threshold "$EVAL_THRESHOLD"
      - name: Broken tutorial fails below threshold ${{ env.EVAL_THRESHOLD }}
        run: |
          set +e
          cargo run -p decon-cli -- eval --out tests/fixtures/tutorials/broken-mini --threshold "$EVAL_THRESHOLD"
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "error: broken-mini unexpectedly passed the eval gate (exit 0)"
            exit 1
          fi
          echo "broken-mini correctly failed with exit $code"
          exit 0

  # M2 hard gate: fail under 85% workspace line coverage (see docs/m2-coverage-baseline.md).
  coverage:
    name: Coverage (≥85% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      # Pinned from taiki-e/install-action@v2.84.1
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
        with:
          tool: cargo-llvm-cov
      - name: Coverage with fail-under 85% lines
        run: |
          cargo llvm-cov --workspace --lcov --output-path target/lcov.info \
            --fail-under-lines 85
      - name: Print coverage summary
        if: always()
        run: cargo llvm-cov report --summary-only
      # Pinned from actions/upload-artifact@v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lcov.info
          path: target/lcov.info
          retention-days: 14

  doc:
    name: Doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo doc --workspace --no-deps

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      # Pinned from taiki-e/install-action@v2.84.1
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      # Pinned from taiki-e/install-action@v2.84.1
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
        with:
          tool: cargo-deny
      - run: cargo deny check

  # M4-SMK-1: nightly LLM smoke verification. Runs the full `decon generate`
  # pipeline against the umbrella fixture with a live DeepSeek key, evals the
  # output, and compares the score to the frozen llm-generated fixture. Opens
  # a GitHub issue on regression. Only runs on schedule (4 AM UTC daily) or
  # via manual dispatch; never on push/PR (no API key in regular CI).
  nightly-llm:
    name: Nightly LLM Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      DECON_MAX_LLM_CALLS: 20
      EVAL_THRESHOLD: 70
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Restore LLM disk cache
        uses: actions/cache@0057852bfa5b37f6b5efde86d0bd74f6d3f4d8a5
        with:
          path: target/decon-llm-cache
          key: decon-llm-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            decon-llm-cache-${{ runner.os }}-
      - name: Generate tutorial with live LLM
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cargo run -p decon-cli -- generate \
            --dir tests/fixtures/umbrella \
            --output-dir /tmp/llm-output \
            --max-abstractions 5
      - name: Eval live output
        id: live_eval
        run: |
          set +e
          output=$(cargo run -p decon-cli -- eval --out /tmp/llm-output --threshold "$EVAL_THRESHOLD" --format json)
          code=$?
          echo "$output"
          echo "live_exit=$code" >> "$GITHUB_OUTPUT"
          live_score=$(echo "$output" | jq -r '.score')
          echo "live_score=$live_score" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "live eval failed with exit $code"
            exit 1
          fi
      - name: Eval frozen fixture
        id: frozen_eval
        run: |
          frozen_score=$(cargo run -p decon-cli -- eval --out tests/fixtures/tutorials/llm-generated --threshold "$EVAL_THRESHOLD" --format json | jq -r '.score')
          echo "frozen_score=$frozen_score" >> "$GITHUB_OUTPUT"
      - name: Compare scores and open issue on regression
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_SCORE: ${{ steps.live_eval.outputs.live_score }}
          FROZEN_SCORE: ${{ steps.frozen_eval.outputs.frozen_score }}
        run: |
          echo "live score: $LIVE_SCORE, frozen score: $FROZEN_SCORE"
          if [ "$LIVE_SCORE" -lt "$FROZEN_SCORE" ]; then
            body="Nightly LLM smoke regression detected.

          - Live score: $LIVE_SCORE
          - Frozen score: $FROZEN_SCORE
          - Threshold: $EVAL_THRESHOLD
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The live \`decon generate\` pipeline scored below the frozen fixture. Investigate the pipeline output and refresh the fixture if the regression is expected."
            gh issue create \
              --title "Nightly LLM smoke regression: live score $LIVE_SCORE < frozen $FROZEN_SCORE" \
              --body "$body" \
              --label "nightly-regression" \
              || true
            exit 1
          fi
          echo "No regression detected."
