[package]
name = "brigid-llm"
description = "LLM provider clients and the LlmClient trait for brigid."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
brigid-core = { path = "../brigid-core", version = "1.0.1" }
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
futures = "0.3"

[dev-dependencies]
serial_test = "3.5.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.20"

[[bench]]
name = "cache_operations"
harness = false
