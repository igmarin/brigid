[package]
name = "decon-pipeline"
description = "Stage orchestration, checkpoint/resume, and dry-run planning for decon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
decon-core = { path = "../decon-core" }
decon-crawl = { path = "../decon-crawl" }
decon-llm = { path = "../decon-llm" }
thiserror = "2.0"
flate2 = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
# Pinned because prompt syntax is sensitive to minijinja/Jinja2 behavior and
# golden/snapshot tests depend on exact render output.
minijinja = "=2.20.0"
# CancellationToken for graceful Ctrl+C / SIGTERM shutdown (issue #68).
tokio-util = { version = "0.7", features = ["rt"] }
# Signal handling (ctrl_c) for the cancellation setup helper (issue #68).
tokio = { version = "1", features = ["macros", "rt", "sync", "signal"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
async-trait = "0.1"

[features]
# Opt-in live LLM smoke tests. When enabled, the `tests/live_smoke.rs`
# integration test is compiled and may make real (budget-capped) API calls
# to DeepSeek. Default builds and CI do NOT enable this feature, so the
# live tests are never compiled or run there. Tests also skip automatically
# when no API key is present in the environment.
live-llm = []
