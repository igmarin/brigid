[package]
name = "brigid-cli"
description = "brigid: deconstruct a codebase into an AI-generated tutorial (CLI binary)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "brigid"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
brigid-core = { path = "../brigid-core", version = "1.2.0" }
brigid-crawl = { path = "../brigid-crawl", version = "1.2.0" }
brigid-llm = { path = "../brigid-llm", version = "1.2.0" }
brigid-pipeline = { path = "../brigid-pipeline", version = "1.2.0" }
clap = { version = "4.6", features = ["derive"] }
clap_mangen = "0.2"
clap_complete = "4.6"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
dirs = "6"

# cargo-binstall support: allows `cargo binstall brigid-cli` to download the
# pre-built Linux binary from GitHub Releases. On macOS/Windows, binstall
# falls back to compiling from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/brigid-{ version }-{ target }{ archive-suffix }"
bin-dir = "brigid-{ version }-{ target }/{ bin }{ format-ext }"
pkg-fmt = "tgz"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
